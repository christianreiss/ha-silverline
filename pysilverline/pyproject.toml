[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysilverline"
version = "0.5.1"
description = "Async client for Poolex Silverline / Tuya v3.3, v3.4 and v3.5 pool heat pumps."
readme = "README.md"
license = "MIT"
# Deliberately one minor below the integration's floor (>=3.13): the library is
# published standalone and must run outside Home Assistant. CI tests 3.12+3.14.
requires-python = ">=3.12"
authors = [{ name = "Christian Reiss", email = "email@christian-reiss.de" }]
keywords = ["tuya", "poolex", "silverline", "heatpump", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = ["cryptography>=44.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout"]

[project.scripts]
pysilverline = "pysilverline.__main__:main"

[project.urls]
Homepage = "https://github.com/christianreiss/ha-silverline"
Issues = "https://github.com/christianreiss/ha-silverline/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pysilverline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --strict-config turns "unknown config option" into an error, so a checkout
# without pytest-timeout fails loudly instead of silently running untimed.
addopts = "-p no:homeassistant -p no:pytest_homeassistant_custom_component -p no:pytest-homeassistant-custom-component -p no:syrupy --strict-config"
timeout = 30

[tool.ruff]
# Mirrors requires-python above.
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF100"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/pysilverline"]
