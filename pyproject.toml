[project]
name = "ha-silverline"
# The authoritative version for users is manifest.json. This block exists
# only so pytest / mypy / coverage can pick the repo up as a package
# during local dev; keep it in sync with the manifest when bumping.
version = "0.11.4"
description = "Home Assistant custom component for Poolex Silverline pool heat pumps."
# 3.13 is a deliberate floor, NOT current HA's (2026.5 requires >=3.14.2). It
# is the oldest interpreter the integration source must stay parseable on,
# matching the HA floor in hacs.json. The library in pysilverline/ is looser
# still (>=3.12) so it stays usable outside HA. Do not "harmonize" the two.
requires-python = ">=3.13"

[project.optional-dependencies]
test = [
  "pysilverline @ file://./pysilverline",
  "pytest>=8",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-homeassistant-custom-component",
  "pytest-timeout",
  "syrupy",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --strict-config turns "unknown config option" into an error, so a checkout
# without pytest-timeout fails loudly instead of silently running untimed.
addopts = "-q --strict-config"
timeout = 30

[tool.ruff]
# Mirrors requires-python above.
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF100"]

[tool.coverage.run]
source = ["custom_components.poolex_silverline"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.mypy]
strict = true
# Match the Python the locally-installed HA was built against — its
# source uses syntax newer than 3.13 in places, and mypy parses it for
# type inference. Our integration code stays 3.13-compatible (no 3.14
# syntax in custom_components/), so CI on 3.13 also parses cleanly.
python_version = "3.14"
files = ["custom_components/poolex_silverline"]
ignore_missing_imports = true
